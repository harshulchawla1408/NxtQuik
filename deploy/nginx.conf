# ==============================================================================
# NGINX Configuration for NxtQuik (Hostinger VPS / Ubuntu Debian)
# Place in: /etc/nginx/sites-available/nxtquik.com
# Enable with: ln -s /etc/nginx/sites-available/nxtquik.com /etc/nginx/sites-enabled/
# Test with: nginx -t
# Reload with: systemctl reload nginx
# ==============================================================================

# 1. HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name nxtquik.com www.nxtquik.com;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://nxtquik.com$request_uri;
    }
}

# 2. Canonical HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nxtquik.com;

    # SSL Certificate paths (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/nxtquik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nxtquik.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Performance & Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Client-side Static Assets (Immutable Cache)
    location /assets/ {
        alias /var/www/nxtquik/dist/client/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static files (favicon, og-image, robots.txt, etc.)
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|avif|txt|woff2?)$ {
        root /var/www/nxtquik/dist/client;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
        access_log off;
    }

    # Reverse Proxy to TanStack Start Node Server (PM2 on port 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 3. Redirect www to non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nxtquik.com;

    ssl_certificate /etc/letsencrypt/live/nxtquik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nxtquik.com/privkey.pem;

    return 301 https://nxtquik.com$request_uri;
}
